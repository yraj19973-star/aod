<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimal Focus Desk</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* Dynamic viewport height fix for mobile browsers */
            background-color: #000000;
            overflow: hidden;
            position: relative;
            padding: clamp(12px, 2.5vw, 40px);
        }

        /* Ambient Glow Layer */
        .ambient-glow {
            position: absolute;
            width: clamp(350px, 60vw, 900px);
            height: clamp(350px, 60vw, 900px);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.04) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(clamp(60px, 8vw, 130px));
            z-index: 1;
            pointer-events: none;
        }

        /* Fullscreen Toggle Button */
        .fs-toggle-btn {
            position: fixed;
            top: clamp(14px, 2.5vh, 28px);
            right: clamp(14px, 2.5vw, 28px);
            z-index: 50;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #64748b;
            padding: clamp(6px, 1vh, 10px) clamp(12px, 1.8vw, 22px);
            font-size: clamp(0.7rem, 0.9vw, 0.85rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .fs-toggle-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* Fluid Responsive Glassmorphic Workspace */
        .workspace {
            position: relative;
            z-index: 10;
            width: min(94vw, 1260px);
            background: rgba(255, 255, 255, 0.015);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: clamp(28px, 5vw, 75px) clamp(24px, 6vw, 90px);
            border-radius: clamp(24px, 4vw, 44px);
            box-shadow: 0 50px 120px rgba(0, 0, 0, 0.95),
                        inset 0 1px 0 rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: clamp(24px, 4vw, 55px);
            width: 100%;
        }

        /* Clock Module */
        .clock-section {
            flex: 1 1 auto;
        }

        .date-display {
            font-size: clamp(0.8rem, 1.3vw, 1.25rem);
            color: #64748b;
            letter-spacing: clamp(2.5px, 0.4vw, 5px);
            text-transform: uppercase;
            margin-bottom: clamp(6px, 1vw, 12px);
            font-weight: 500;
        }

        .time-display {
            font-size: clamp(3.6rem, 10.5vw, 10rem);
            font-weight: 200;
            color: #ffffff;
            letter-spacing: -3px;
            line-height: 0.95;
            display: flex;
            align-items: baseline;
            flex-wrap: nowrap;
        }

        .seconds {
            font-size: clamp(1.4rem, 3.6vw, 3.6rem);
            margin-left: clamp(6px, 1vw, 14px);
            color: #38bdf8;
            font-weight: 300;
        }

        .period {
            font-size: clamp(0.9rem, 1.6vw, 1.7rem);
            color: #334155;
            margin-left: clamp(8px, 1.2vw, 18px);
            font-weight: 600;
        }

        .divider {
            width: 1px;
            height: clamp(100px, 14vw, 180px);
            background: rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        /* Weather Module */
        .weather-section {
            width: clamp(200px, 24vw, 320px);
            color: #ffffff;
            flex-shrink: 0;
        }

        .location-display {
            font-size: clamp(0.75rem, 1.1vw, 1.1rem);
            color: #64748b;
            letter-spacing: clamp(2.5px, 0.35vw, 4.5px);
            text-transform: uppercase;
            margin-bottom: clamp(6px, 1vw, 10px);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .temp-display {
            font-size: clamp(2.8rem, 5.5vw, 5.2rem);
            font-weight: 300;
            line-height: 1;
            margin-bottom: clamp(4px, 0.8vw, 8px);
        }

        .weather-condition {
            font-size: clamp(0.85rem, 1.2vw, 1.2rem);
            color: #cbd5e1;
            margin-bottom: clamp(10px, 1.5vw, 18px);
        }

        .weather-details {
            display: flex;
            gap: clamp(14px, 2vw, 28px);
            font-size: clamp(0.75rem, 0.95vw, 0.95rem);
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: clamp(10px, 1.2vw, 16px);
        }

        .detail-label {
            color: #475569;
            text-transform: uppercase;
            font-size: clamp(0.6rem, 0.75vw, 0.75rem);
            letter-spacing: 1.2px;
            margin-bottom: 2px;
        }

        .detail-value {
            color: #e2e8f0;
            font-weight: 500;
        }

        /* Study Quotes Module */
        .quote-container {
            margin-top: clamp(24px, 4vw, 45px);
            padding-top: clamp(18px, 2.5vw, 32px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            min-height: clamp(65px, 8vw, 95px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .quote-text {
            font-size: clamp(0.95rem, 1.4vw, 1.45rem);
            line-height: 1.55;
            color: #e2e8f0;
            font-weight: 300;
            transition: opacity 0.6s ease;
            max-width: 90%;
        }

        .quote-tag {
            display: block;
            margin-top: clamp(6px, 1vw, 12px);
            font-size: clamp(0.7rem, 0.85vw, 0.85rem);
            letter-spacing: clamp(2px, 0.25vw, 3.5px);
            text-transform: uppercase;
            color: #38bdf8;
            font-weight: 600;
        }

        /* Mobile & Narrow Screen Stacking Layout */
        @media (max-width: 768px) {
            body {
                overflow-y: auto; /* Gracefully permit vertical breathing space on tiny screens */
            }
            .stats-row {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 24px;
            }
            .clock-section {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .divider {
                width: 80%;
                height: 1px;
            }
            .weather-section {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .weather-details {
                justify-content: center;
                gap: 32px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <button class="fs-toggle-btn" onclick="toggleFullscreen()">Fullscreen</button>

    <div class="ambient-glow"></div>

    <div class="workspace">
        <div class="stats-row">
            <div class="clock-section">
                <div class="date-display" id="date">LOADING...</div>
                <div class="time-display">
                    <span id="time">00:00</span>
                    <span class="seconds" id="seconds">00</span>
                    <span class="period" id="period">PM</span>
                </div>
            </div>

            <div class="divider"></div>

            <div class="weather-section">
                <div class="location-display" id="location">LOCATING...</div>
                <div class="temp-display" id="temp">--°</div>
                <div class="weather-condition" id="condition">Loading weather...</div>
                <div class="weather-details">
                    <div>
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value" id="humidity">--%</div>
                    </div>
                    <div>
                        <div class="detail-label">Wind</div>
                        <div class="detail-value" id="wind">-- km/h</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="quote-container">
            <div class="quote-text" id="quote-element">
                <span id="quote-body">"Consistency beats raw intelligence every single time."</span>
                <span class="quote-tag" id="quote-tag">— Focus</span>
            </div>
        </div>
    </div>

    <script>
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const period = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12 || 12;
            hours = String(hours).padStart(2, '0');

            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('time').textContent = `${hours}:${minutes}`;
            document.getElementById('seconds').textContent = seconds;
            document.getElementById('period').textContent = period;
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }
        updateClock();
        setInterval(updateClock, 1000);

        // --- STUDY & DISCIPLINE QUOTES ---
        const studyKeywords = [
            "learn", "study", "knowledge", "work", "discipline", "focus", "effort",
            "habit", "action", "practice", "master", "time", "success", "mistake",
            "patience", "hard", "problem", "solve", "mind", "goal", "rank", "fail"
        ];

        const offlineStudyQuotes = [
            { text: "Consistency beats raw intelligence every single time in competitive exams.", author: "Discipline" },
            { text: "Don't count the hours you sit. Count the quality problems you cracked.", author: "Productivity" },
            { text: "Mock test scores don't define you, but your depth of analysis will.", author: "Self Correction" },
            { text: "The pain of sitting at your desk now is nothing compared to the regret on result day.", author: "Reality Check" },
            { text: "Concepts over memory. Understand the derivation before memorizing formulas.", author: "Fundamentals" },
            { text: "Silly mistakes in easy questions cost more rank positions than unsolved hard ones.", author: "Precision" },
            { text: "Zero backlog is the single strongest asset any student can maintain.", author: "Strategy" },
            { text: "Your competition is solving PYQs right now while you are thinking about sitting down.", author: "Urgency" },
            { text: "If you get tired, learn to take a 10-minute walk, never to quit the day.", author: "Endurance" },
            { text: "Doubt is killed by solving problems on paper, not by thinking about the syllabus.", author: "Action" }
        ];

        let seenQuotes = new Set();

        async function fetchStudyQuoteFromWeb() {
            const quoteEl = document.getElementById('quote-element');
            const quoteBody = document.getElementById('quote-body');
            const quoteTag = document.getElementById('quote-tag');

            let pickedText = "";
            let pickedAuthor = "";

            try {
                const response = await fetch("https://api.quotable.io/quotes/random?limit=5&tags=education|wisdom|perseverance");
                if (response.ok) {
                    const data = await response.json();
                    for (const item of data) {
                        const contentLower = item.content.toLowerCase();
                        const isStudyRelated = studyKeywords.some(keyword => contentLower.includes(keyword));
                        if (isStudyRelated && !seenQuotes.has(item.content)) {
                            pickedText = item.content;
                            pickedAuthor = item.author;
                            seenQuotes.add(pickedText);
                            break;
                        }
                    }
                }
            } catch (err) {}

            if (!pickedText) {
                let available = offlineStudyQuotes.filter(q => !seenQuotes.has(q.text));
                if (available.length === 0) {
                    seenQuotes.clear();
                    available = offlineStudyQuotes;
                }
                const fallbackItem = available[Math.floor(Math.random() * available.length)];
                pickedText = fallbackItem.text;
                pickedAuthor = fallbackItem.author;
                seenQuotes.add(pickedText);
            }

            quoteEl.style.opacity = '0';
            setTimeout(() => {
                quoteBody.textContent = `"${pickedText}"`;
                quoteTag.textContent = `— ${pickedAuthor}`;
                quoteEl.style.opacity = '1';
            }, 600);
        }

        fetchStudyQuoteFromWeb();
        setInterval(fetchStudyQuoteFromWeb, 60000);

        // --- RELIABLE WEATHER & GPS ENGINE ---
        function interpretWeatherCode(code) {
            const mapping = {
                0: "Clear Sky", 1: "Mainly Clear", 2: "Partly Cloudy", 3: "Overcast",
                45: "Foggy", 48: "Depositing Rime Fog", 51: "Light Drizzle",
                53: "Moderate Drizzle", 55: "Dense Drizzle", 61: "Slight Rain",
                63: "Moderate Rain", 65: "Heavy Rain", 71: "Slight Snow",
                73: "Moderate Snow", 75: "Heavy Snow", 95: "Thunderstorm"
            };
            return mapping[code] || "Clear";
        }

        async function pullWeatherData(lat, lon) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&current_weather=true`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("API error");
                const d = await res.json();
                
                let tempVal = 26;
                let codeVal = 0;
                let humVal = 60;
                let windVal = 8;

                if (d.current) {
                    tempVal = d.current.temperature_2m !== undefined ? d.current.temperature_2m : tempVal;
                    codeVal = d.current.weather_code !== undefined ? d.current.weather_code : codeVal;
                    humVal = d.current.relative_humidity_2m !== undefined ? d.current.relative_humidity_2m : humVal;
                    windVal = d.current.wind_speed_10m !== undefined ? d.current.wind_speed_10m : windVal;
                } else if (d.current_weather) {
                    tempVal = d.current_weather.temperature;
                    codeVal = d.current_weather.weathercode;
                    windVal = d.current_weather.windspeed;
                }

                document.getElementById('temp').textContent = `${Math.round(tempVal)}°`;
                document.getElementById('condition').textContent = interpretWeatherCode(codeVal);
                document.getElementById('humidity').textContent = `${humVal}%`;
                document.getElementById('wind').textContent = `${windVal} km/h`;
            } catch (e) {
                document.getElementById('temp').textContent = "26°";
                document.getElementById('condition').textContent = "Clear Sky";
                document.getElementById('humidity').textContent = "58%";
                document.getElementById('wind').textContent = "7 km/h";
            }
        }

        async function syncLocationAndWeather() {
            pullWeatherData(22.8046, 86.2029);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        try {
                            const revGeo = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                            if (revGeo.ok) {
                                const placeData = await revGeo.json();
                                const exactPlace = placeData.address.city || 
                                                   placeData.address.town || 
                                                   placeData.address.suburb || 
                                                   placeData.address.county || 
                                                   "LOCAL";
                                document.getElementById('location').textContent = exactPlace.toUpperCase();
                            }
                        } catch (e) {
                            document.getElementById('location').textContent = "LOCAL";
                        }

                        pullWeatherData(lat, lon);
                    },
                    () => {
                        fallbackToIpLocation();
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 }
                );
            } else {
                fallbackToIpLocation();
            }
        }

        async function fallbackToIpLocation() {
            try {
                const res = await fetch('https://get.geojs.io/v1/ip/geo.json');
                if (res.ok) {
                    const data = await res.json();
                    if (data.city) {
                        document.getElementById('location').textContent = data.city.toUpperCase();
                    }
                    if (data.latitude && data.longitude) {
                        pullWeatherData(parseFloat(data.latitude), parseFloat(data.longitude));
                        return;
                    }
                }
            } catch (e) {}

            document.getElementById('location').textContent = "LOCAL";
            pullWeatherData(22.8046, 86.2029);
        }

        syncLocationAndWeather();
        setInterval(syncLocationAndWeather, 900000);
    </script>
</body>
</html>
